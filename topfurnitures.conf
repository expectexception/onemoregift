server {
    listen 80;
    listen [::]:80;
    server_name topfurnitures.in www.topfurnitures.in;
    root /var/www/topfurnitures;
    index index.html index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
