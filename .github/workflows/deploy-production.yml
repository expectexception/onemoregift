name: Deploy production → DreamHost

# Push to the `production` branch runs the backend tests, then builds a release
# tarball here (DreamHost shared hosting can't build Next.js) and ships it to
# the server with deploy/dreamhost/shared/deploy.sh. Also runnable manually
# from the Actions tab. See deploy/dreamhost/shared/README.md.
on:
  push:
    branches: [production]
  workflow_dispatch: {}

# Never let two deploys run at once; a queued push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests (Node 18, as on the server)
    runs-on: ubuntu-24.04   # same Ubuntu as the DreamHost server
    steps:
      - uses: actions/checkout@v4

      # Production runs on DreamHost's system Node 18.19, so test on exactly that.
      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - name: Install
        working-directory: backend
        run: npm ci

      # Node 18 doesn't expand globs itself, so list the files explicitly.
      - name: Test
        working-directory: backend
        run: node --test $(find test -name '*.test.js')
        env:
          NODE_ENV: test

  deploy:
    name: Build release & deploy
    needs: test
    runs-on: ubuntu-24.04   # same Ubuntu as the DreamHost server
    # Optional: create a "production" Environment in GitHub to add approval gates.
    environment: production
    env:
      SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
      SSH_TARGET: ${{ vars.DREAMHOST_SSH_TARGET || 'dh_nbu4fu@sin1-shared-01.dreamhost.com' }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN || 'https://onemoregift.in' }}
      # Public values that get compiled into the browser bundle.
      NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN: ${{ vars.NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN || 'true' }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '793247578456-coektui6o4hfm0qh2alacdb5ks5jfbis.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release tarball
        run: bash deploy/dreamhost/shared/build-release.sh

      # Don't fail the run before the key exists: skip with a warning instead.
      - name: Check deploy key
        id: gate
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::DREAMHOST_SSH_KEY secret not set — built the release but skipped the deploy. See deploy/dreamhost/shared/README.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host keys (from the DreamHost panel), so a spoofed server is rejected.
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/deploy/dreamhost/shared/known_hosts" \
          TARBALL="$(cat dist/release/LATEST)" \
            bash deploy/dreamhost/shared/deploy.sh

      - name: Smoke test the live site
        if: steps.gate.outputs.enabled == 'true'
        run: |
          for path in / /shop /api/v1/health /api/altcha/challenge; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$PUBLIC_ORIGIN$path")
            echo "$code $path"
            [ "$code" = 200 ] || { echo "::error::$path returned $code"; exit 1; }
          done
          # The health check reports the deployed commit; it must be this one.
          expected=$(git rev-parse --short HEAD)
          live=$(curl -s --max-time 30 "$PUBLIC_ORIGIN/api/v1/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('release'))")
          echo "live release: $live (expected $expected)"
          [ "$live" = "$expected" ] || { echo "::error::live site runs $live, not $expected"; exit 1; }
